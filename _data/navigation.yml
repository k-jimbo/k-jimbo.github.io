# The following is the order of the links in the header of the website.
#
# Changing the order here will adjust the order and you can also add additional
# links. Removing a link prevents it from showing in the header, but does not
# prevent it from being included in the site.
#
# NOTE that only one of the CV options should be selected, the first is for the
#      Markdown formatted page while the second is generated using JSON.

# NOTE: `key` maps each entry to a label in _data/nav_text.yml so the menu
#       text can be localized based on page.lang (jekyll-polyglot). `title`
#       is kept as the fallback label if a `key` lookup ever comes up empty.
main:
  - title: "Publications"
    url: /publications/
    key: publications

  - title: "Talks"
    url: /talks/
    key: talks

  - title: "Teaching"
    url: /teaching/
    key: teaching

  - title: "Portfolio"
    url: /portfolio/
    key: portfolio

  - title: "Blog Posts"
    url: /year-archive/
    key: blog_posts

  - title: "CV"
    url: /cv/
    key: cv

  # - title: "CV"
  #   url: /cv-json/

  - title: "Guide"
    url: /markdown/
    key: guide
